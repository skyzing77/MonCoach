<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d1020">
<meta name="robots" content="noindex, nofollow">
<title>Page introuvable – Mon coach</title>
<style>
  :root{--bg:#0d1020;--ink:#f2f3fa;--mute:#9aa1bd;--acc:#8f73ff;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;
    background:radial-gradient(42% 38% at 14% 20%,rgba(91,61,245,.34),transparent 70%),radial-gradient(40% 36% at 88% 30%,rgba(255,94,108,.28),transparent 70%),var(--bg);
    color:var(--ink);font:16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;text-align:center}
  h1{font-size:clamp(34px,8vw,56px);line-height:1.05;letter-spacing:-.03em;margin:0 0 12px}
  p{color:var(--mute);margin:0 0 28px}
  a{display:inline-block;padding:12px 20px;border-radius:999px;background:var(--acc);color:#0d1020;font-weight:700;text-decoration:none}
  a:focus-visible{outline:3px solid var(--acc);outline-offset:4px}
</style>
</head>
<body>
<main>
  <h1>Page introuvable</h1>
  <p>Cette page n’existe pas ou a été déplacée.</p>
  <a id="home" href="/MonCoach/">Retour à l’accueil</a>
</main>
<script>
  /* GitHub Pages sert cette page pour toute adresse inconnue : on calcule le lien d'accueil
     à partir du premier dossier de l'URL (fonctionne aussi avec un domaine personnalisé). */
  (function(){var seg=location.pathname.split('/')[1];
    document.getElementById('home').href=(location.hostname.endsWith('github.io')&&seg)?'/'+seg+'/':'/';})();
</script>
</body>
</html>
